<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance MCP</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e11;color:#eaecef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#181a20;border:1px solid #2b3139;border-radius:22px;padding:28px;box-shadow:0 24px 70px #0008}h1{margin:0 0 8px;font-size:28px}.muted{color:#929aa5;line-height:1.8}.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid #333b46;border-radius:999px;padding:8px 12px;margin:12px 0}.dot{width:9px;height:9px;border-radius:50%;background:#f0b90b}.ok .dot{background:#0ecb81}.bad .dot{background:#f6465d}.tools{margin-top:20px;display:grid;gap:10px}.tool{padding:13px 14px;border-radius:12px;background:#11151b;border:1px solid #252b33;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;direction:ltr;text-align:left}code{color:#f0b90b}</style></head><body><main class="card"><h1>Binance USDⓈ-M MCP</h1><p class="muted">واجهة قراءة فقط لحساب العقود الآجلة. لا توجد أدوات شراء أو بيع أو إلغاء أو تحويل أو تعديل رافعة.</p><div id="status" class="pill"><span class="dot"></span><span>جاري فحص الإعداد…</span></div><div class="tools"><div class="tool">futures_balance</div><div class="tool">futures_open_positions</div><div class="tool">futures_account_summary</div></div><p class="muted">Endpoint: <code>/api/mcp</code></p></main><script>fetch('/api/mcp').then(r=>r.json()).then(x=>{const s=document.getElementById('status');s.classList.add(x.configured?'ok':'bad');s.querySelector('span:last-child').textContent=x.configured?'متصل ومهيأ':'بانتظار متغيرات البيئة في Vercel';}).catch(()=>{document.getElementById('status').querySelector('span:last-child').textContent='تعذر فحص الحالة';});</script></body></html>

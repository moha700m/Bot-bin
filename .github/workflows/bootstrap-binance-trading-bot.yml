name: bootstrap-binance-trading-bot
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/project.tar.gz'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bot
          mkdir -p /tmp/bot
          tar -tzf .bootstrap/project.tar.gz >/dev/null
          tar -xzf .bootstrap/project.tar.gz -C /tmp/bot
          test -f /tmp/bot/binance-trading-bot/package.json
          cp -a /tmp/bot/binance-trading-bot/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-binance-trading-bot.yml

      - name: Install dependencies
        run: npm install

      - name: Verify
        run: npm run check

      - name: Commit validated project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Binance Futures Command Center'
          git push origin HEAD:main

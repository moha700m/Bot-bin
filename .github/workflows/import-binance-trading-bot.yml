name: import-binance-trading-bot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-binance-trading-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source /tmp/project
          git clone --depth 1 --branch binance-trading-bot https://github.com/moha700m/New-newtwor.git /tmp/source
          cat /tmp/source/.bootstrap/binance-trading-bot.part-*.b64 | base64 -d > /tmp/project.tar.gz
          tar -tzf /tmp/project.tar.gz >/dev/null
          mkdir -p /tmp/project
          tar -xzf /tmp/project.tar.gz -C /tmp/project
          test -f /tmp/project/binance-trading-bot/package.json
          cp -a /tmp/project/binance-trading-bot/. ./
          rm -f .github/workflows/bootstrap-binance-trading-bot.yml
          rm -f .github/workflows/import-binance-trading-bot.yml

      - name: Write repository CI
        shell: bash
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: trading-bot-ci
          on:
            push:
              branches: [main]
            pull_request:
          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm install
                - run: npm run check
          YAML

      - name: Install dependencies
        run: npm install

      - name: Full verification
        run: npm run check

      - name: Commit exact validated project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Binance Futures Command Center'
          git push origin HEAD:main

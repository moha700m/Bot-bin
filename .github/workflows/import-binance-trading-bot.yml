name: import-binance-trading-bot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-binance-trading-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct source bundle
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/import-binance-trading-bot.yml /tmp/import-workflow.yml
          rm -rf /tmp/source /tmp/project
          git clone --depth 1 --branch binance-trading-bot https://github.com/moha700m/New-newtwor.git /tmp/source
          cat /tmp/source/.bootstrap/binance-trading-bot.part-*.b64 | base64 -d > /tmp/project.tar.gz
          tar -tzf /tmp/project.tar.gz >/dev/null
          mkdir -p /tmp/project
          tar -xzf /tmp/project.tar.gz -C /tmp/project
          test -f /tmp/project/binance-trading-bot/package.json
          cp -a /tmp/project/binance-trading-bot/. ./
          rm -rf .github
          mkdir -p .github/workflows
          cp /tmp/import-workflow.yml .github/workflows/import-binance-trading-bot.yml

      - name: Apply verification fixes
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/import Decimal from 'decimal.js';/import { Decimal } from 'decimal.js';/" src/server/binance/filters.ts src/server/risk.ts
          sed -i "s/audit, getPlan, getRiskSettings, savePlan, setSignalStatus/audit, getPlan, savePlan, setSignalStatus/" src/server/execution.ts
          python - <<'PY'
          from pathlib import Path
          p=Path("src/server/index.ts")
          s=p.read_text()
          old="  reply.code(status).send({error:'REQUEST_FAILED',message:error.message});"
          new="  reply.code(status).send({error:'REQUEST_FAILED',message:(error as Error).message});"
          if old not in s:
              raise SystemExit("index.ts patch target not found")
          p.write_text(s.replace(old,new))
          PY

      - name: Install dependencies
        run: npm install

      - name: Full verification
        run: npm run check

      - name: Commit validated project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Binance Futures Command Center'
          git push origin HEAD:main
